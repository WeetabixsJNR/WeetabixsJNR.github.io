# About Section
blurb: IT professional with continuous experience since March 2020, currently leading day-to-day IT operations, infrastructure and service desk, for a multi-site organisation supporting around 500 to 600 users and 310 devices. I build automation, workflows and integrations around how an organisation already works, understanding a process with the people who use it before redesigning it.

blurb-btn-link: "/about"
blurb-btn-name: know more

# About Page

# Work Process Section
work-process:
  - title: "Understand"
    icon: "assets/images/icons/plan.png"
    content: "Meet the people who own the process, map how it actually runs today, and find where it's fragile before touching a system."

  - title: "Build Around the Workflow"
    icon: "assets/images/icons/design.png"
    content: "Automation, workflows and integrations designed around how an organisation already works, reducing repetitive tasks and making technology simpler to use, not the other way round."

  - title: "Prove It Before Rollout"
    icon: "assets/images/icons/print.png"
    content: "Working prototypes before wide rollout, documented RTO/RPO, and clear reporting for senior leadership, so change lands without disrupting the work it's meant to support."

