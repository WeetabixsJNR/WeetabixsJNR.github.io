# Selected Projects Section

projects-title: Selected Projects
projects:
  - {
      name: "Quality Document Governance Framework",
      icon: ti-agenda,
      accent: "#28B78D",
      tag: "SharePoint / Power Automate",
      description: "Designed a controlled-document system on SharePoint, Word and Power Automate around how authors, reviewers and approvers already worked: seven-state approval lifecycle, least-privilege permissions, governed metadata. Proved the design in a working prototype before rollout.",
    }
  - {
      name: "Staff Onboarding Automation",
      icon: ti-bolt-alt,
      accent: "#286FD6",
      tag: "Power Automate / Microsoft Forms",
      description: "Automated joiner workflow shaped by direct conversations with hiring managers, building management and HR: one form triggers job-code assignment, site-access alerts, and IT/equipment provisioning, replacing an ad hoc, email-based process.",
    }
  - {
      name: "Managed IT Services Tender",
      icon: ti-search,
      accent: "#8C45C8",
      tag: "Vendor Evaluation / SLAs",
      description: "Led requirements gathering, weighted supplier evaluation, and a documented recommendation for an organisation-wide managed services contract.",
    }
  - {
      name: "Windows 11 & Endpoint Rollout",
      icon: ti-desktop,
      accent: "#F59F00",
      tag: "Intune / Autopilot",
      description: "Coordinated an org-wide rollout across roughly 300 devices using Intune and Autopilot: deployment planning, staff guidance, progress reporting.",
    }

