# Services Section

services-title: Hobbies
services:
  - {
      name: Gaming and Learning,
      icon: ti-game,
      description: "In my downtime I'm usually gaming with friends, which more often than not means I'm also the one running the servers that keep those sessions going, from game servers to the odd Discord bot. I balance that with a lot of learning through online content, poking at something until I understand it, which feeds straight back into how I work.",
      active: false,
    }
  - {
      name: Live AV and Events,
      icon: ti-video-camera,
      description: "I run live audio and video for staff days, graduations and other events, plus podcasting and hybrid setups that mix in-person attendees with a Zoom or streamed audience. Getting the mix right in the room, on the stream and in the recording all at once is its own kind of troubleshooting. Channels like EposVox are still a big part of how I learn new techniques.",
      active: false,
    }
  - {
      name: Craftsmanship,
      icon: ti-ruler-pencil,
      description: "Passionate about hands-on projects involving metal, wood, 3D printing and CAD design. I love designing and printing random fixes and gadgets for things around the house, and I enjoy taking an idea from a CAD model to something I can actually hold.",
      active: false,
    }

