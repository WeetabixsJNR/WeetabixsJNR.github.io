{% if site.data.settings.skills %}
<!-- skills -->
<section class="section section-skills bg-gray">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <h2 class="section-title">{{ site.data.settings.skills-title }}</h2>
      </div>
      {% for skill in site.data.settings.skills %}
      <div class="col-lg-6 mb-4">
        <div class="d-flex justify-content-between mb-2">
          <span class="font-secondary" style="font-weight: 700;">{{ skill.name }}</span>
          <span class="mono text-light">{{ skill.value }}</span>
        </div>
        <div class="skill-bar-track">
          <div class="skill-bar-fill" style="width: {{ skill.value }}; background: {{ skill.color }};"></div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- /skills -->
{% endif %}
