<!-- footer -->
<footer class="bg-dark footer-section">
  <div class="section">
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <span class="footer-label mono">EMAIL</span>
          <p class="text-white footer-value font-secondary">{{ site.data.settings.email }}</p>
        </div>
        <div class="col-md-4">
          <span class="footer-label mono">PHONE</span>
          <p class="text-white footer-value font-secondary">{{ site.data.settings.phone }}</p>
        </div>
        <div class="col-md-4">
          <span class="footer-label mono">ELSEWHERE</span>
          <div class="footer-social">
            {% for social in site.data.settings.social %}
            <a href="{{ social.link }}"><i class="{{ social.icon }}"></i></a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="border-top text-center border-dark py-5">
    <p class="mb-0 text-light">{{site.data.settings.copyright | markdownify}}</p>
  </div>
</footer>
<!-- /footer -->


<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
