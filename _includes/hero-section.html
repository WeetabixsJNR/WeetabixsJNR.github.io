<!-- hero area -->
<section class="hero-area">
  <div class="hero-spine"></div>
  <div class="container">
    <div class="row">
      <div class="col-lg-11">
        <span class="hero-label mono">PORTFOLIO</span>
        <h1 class="hero-heading">{{ site.data.settings.hero.hero-title }}</h1>
        <p class="hero-subtitle">{{ site.data.settings.hero.hero-subtitle }}</p>
      </div>
    </div>
  </div>
  <div class="hero-panel">
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <span class="hero-panel-label mono">CURRENT ROLE</span>
          <p class="hero-panel-value">{{ site.data.settings.hero.hero-role }}</p>
        </div>
        <div class="col-md-4">
          <span class="hero-panel-label mono">BASED IN</span>
          <p class="hero-panel-value">{{ site.data.settings.hero.hero-location }}</p>
        </div>
        <div class="col-md-4">
          <span class="hero-panel-label mono">EXPERIENCE</span>
          <p class="hero-panel-value">{{ site.data.settings.hero.hero-experience }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- /hero area -->
