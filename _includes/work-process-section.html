{% if site.data.settings.work-process %}
<!-- Work Process -->
<section class="section section-workflow">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <h2 class="section-title">How I Work</h2>
      </div>
    </div>
    <div class="row workflow-row">
      {% assign workflow-colors = "#F59F00|#151B22|#28B78D" | split: "|" %}
      {% for work in site.data.settings.work-process %}
      <div class="col-md-4 mb-4 mb-md-0">
        <div class="workflow-step" style="background: {{ workflow-colors[forloop.index0] }};">
          <span class="workflow-num mono">{{ forloop.index }}</span>
          <h4>{{ work.title }}</h4>
          <p>{{ work.content | markdownify }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ./Work Process -->
{% endif %}
