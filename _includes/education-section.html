{% if site.data.settings.education %}
<!-- education -->
<section class="section section-education position-relative">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-title">{{ site.data.settings.education-title }}</h2>
      </div>
      {% for education in site.data.settings.education %}
      <div class="col-lg-6 col-md-6 mb-4">
        <div class="d-flex bg-white shadow p-4" style="border-left: 4px solid #D64040;">
          <div class="mr-lg-4 mr-3">
            <i class="ti-medall icon icon-light icon-bg bg-white rounded-circle d-block"></i>
          </div>
          <div>
            <p class="text-dark mb-1 mono">{{ education.date }}</p>
            <h4>{{ education.name }}</h4>
            <p class="mb-0 text-light mono">{{ education.organization }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <!-- bg image -->
  <img class="img-fluid edu-bg-image w-100" src="{{ site.baseurl }}/assets/images/backgrounds/education-bg.png" alt="bg-image">
</section>
<!-- /education -->
{% endif %}
