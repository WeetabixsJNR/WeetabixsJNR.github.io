{% if site.data.settings.experience %}
<!-- experience -->
<section class="section section-experience">
  <div class="container">
    <div class="row justify-content-around">
      <div class="col-lg-12">
        <h2 class="section-title">{{ site.data.settings.experience-title }}</h2>
      </div>
      {% for experience in site.data.settings.experience %}
      <div class="col-lg-4 col-md-4 mb-4">
        <div class="card h-100 p-4" style="border-top-color: #28B78D;">
          <p class="mb-2 mono">{{ experience.date }}</p>
          <h4>{{ experience.name }}</h4>
          <h6 class="text-light mono">{{ experience.organization }}</h6>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ./experience -->
{% endif %}
